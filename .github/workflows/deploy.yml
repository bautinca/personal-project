name: CI/CD Deploy

# El pipeline de CI/CD se ejecutara en dos casos: cuando se haga push a la rama deploy o cuando se ejecute
# manualmente desde la pestaña de Actions en GitHub (workflow_dispatch)
on:
  push:
    branches: [deploy]
  workflow_dispatch:

# Definimos los permisos que tendra el workflow. En este caso, necesitamos permisos de lectura para el contenido
# del repositorio y permisos de escritura para el id-token, que es necesario para autenticarnos con AWS usando OIDC (OpenID Connect).
permissions:
  contents: read
  id-token: write

# El concurrency nos permite controlar la concurrencia de los jobs. En este caso, estamos diciendo que solo puede haber
# un job de deploy en ejecucion al mismo tiempo. Si se ejecuta otro job de deploy mientras hay uno en ejecucion, el nuevo job se pondra en cola y esperara a que el job
# en ejecucion termine. Esto es util para evitar que se desplieguen varias versiones de la aplicacion al mismo tiempo y se generan conflictos.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# Definimos variables de entorno que se usaran en todo el workflow. Estas variables de entorno son necesarias para desplegar
# la aplicacion en AWS ECS
env:
  AWS_REGION: us-east-2 # Region donde se encuentra nuestro cluster de ECS
  ECR_REPOSITORY: personal-project # Nombre del repositorio de ECR donde se subira la imagen de Dockerfile de nuestro proyecto
  ECS_CLUSTER: personal-project-cluster # Nombre del cluster de ECS donde se desplegara la aplicacion
  ECS_SERVICE: personal-project-service # Nombre del servicio de ECS donde se desplegara la aplicacion
  ECS_TASK_DEFINITION: personal-project-task # Nombre de la definicion de tarea de ECS que se usara para desplegar la aplicacion
  CONTAINER_NAME: web # Nombre del contenedor dentro de la definicion de tarea de ECS que se usara para desplegar la aplicacion

# Definimos los jobs que se ejecutaran en este workflow. En este caso, tenemos dos jobs: test y deploy.
# El jobs de test se ejecutara primero y el job de deploy se ejecutara solo si el job de test termina correctamente. Esto es util para asegurarnos de que
# la aplicacion pasa todas las pruebas antes de desplegarla en produccion.
jobs:
  # Si notamos este job hace exactamente lo mismo que el job de test del workflow de CI, pero con la diferencia que este
  # job se ejecuta en la rama deploy y no en la rama main.
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      db_test:
        image: postgres:16
        env:
          POSTGRES_USER: max
          POSTGRES_PASSWORD: max123
          POSTGRES_DB: personal_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_NAME: personal_project
      DB_USER: max
      DB_PASSWORD: max123
      DB_HOST: localhost
      DB_PORT: 5432
      TEST_DB_NAME: personal_project
      TEST_DB_USER: max
      TEST_DB_PASSWORD: max123
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: personal_project.settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest base/tests/unit/ -v

      - name: Migrate test database
        run: python manage.py migrate

      - name: Acceptance tests
        run: behave features/

  # Ahora la segunda fase, el job de deploy (la parte nueva del workflow). Este job se ejecutara solo si el job de test
  # termina correctamente. Esto es util para asegurarnos de que la aplicacion pasa todas las pruebas antes de desplegarla en produccion.
  deploy:
    name: Deploy to ECS
    needs: test # El job 'deploy' arranca si el job 'test' termina correctamente, si falla algo del linter ruff, test unitarios o test de aceptacion con behave entonces no llega a la parte de AWS
    runs-on: ubuntu-latest
    steps:
      # Aca se descarga todo el contenido de la rama deploy del repositorio para poder construir la imagen de Dockerfile y subirla a ECR (Elastic Container Registry) de AWS.
      - name: Checkout
        uses: actions/checkout@v4

      # Ahora entramos de lleno a la parte de AWS. Primero configuramos las credenciales de AWS usando OIDC (OpenID Connect) para autenticarnos con AWS sin necesidad de usar claves de acceso. Esto es mas seguro y recomendado por AWS
      # Github solicita un token OIDC y AWS verifica la rama deploy, el repositorio, el proveedor OIDC y politica de confianza del rol IAM
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }} # Si todo esta bien entonces Github asume el rol GitHubActionsDeployPersonalProject (rol creado en AWS) y obtiene credenciales temporales para poder interactuar con los servicios de AWS
          aws-region: ${{ env.AWS_REGION }} # Definimos la region de AWS donde se encuentra nuestro cluster de ECS
      
      # Ahora que tenemos las credenciales temporales de AWS, podemos loguearnos en ECR (Elastic Container Registry) para poder subir la imagen de Dockerfile de nuestro proyecto. Esto es necesario porque ECR es un servicio de AWS que nos permite almacenar y gestionar imágenes de contenedores Docker.
      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      # Ahora que estamos logueados en ECR podemos construir la imagen de Dockerfile de nuestro proyecto y subirla a ECR. 
      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        # Construimos la imagen de Dockerfile y la subimos a ECR. El nombre de la imagen sera el nombre del repositorio de ECR y el tag sera el SHA del commit actual. Esto nos permite tener un control de versiones de las imagenes de Dockerfile que subimos a ECR.
        # Por ejemplo la imagen construida y subida a ECR sera algo como $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        run: |
          docker build -f dockerfile -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
      
      # Ya tenemos la imagen cargada en ECR, ahora necesitamos actualizar la definicion de tarea de ECS para que use la nueva imagen que acabamos de subir a ECR
      # Para eso necesitamos descargar la definicion de tarea actual de ECS, actualizar la imagen del contenedor y registrar la nueva definicion de tarea en ECS
      # Esto conserva la configuracion existente en la defincion de tarea, como variables de secrets manager, rol de ejecucion
      # puerto 8000, cpu y memoria, config. del contenedor, etc. lo unico que cambiamos en la definicion de tarea es la imagen del contenedor que ahora apunta a la nueva imagen que acabamos de subir a ECR
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json
      
      # Es lo mismo que dijimos antes pero ahora concretamente estamos usando jq para actualizar la imagen del contenedor en la definicion de tarea.
      - name: Update task definition image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        # Buscamos el contenedor con el nombre definido en la variable de entorno CONTAINER_NAME y actualizamos su imagen con la nueva imagen que acabamos de subir a ECR. Luego eliminamos algunos campos que no son necesarios para registrar la nueva definicion de tarea en ECS. 
        run: |
          jq --arg image "$IMAGE" --arg name "$CONTAINER_NAME" \
            '.containerDefinitions |= map(if .name == $name then .image = $image else . end) |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > task-definition-rendered.json
      
      # Ahora ya actualizada la definicion de tarea con la nueva imagen ahora necesitamos registrar una nueva revision de la definicion de tarea en ECS
      # Osea simplemente creamos otra revision, si la revision anterior era personal-project-task:4 (con la imagen anterior) ahora esta seria personal-project-task:5 (con la nueva imagen)
      - name: Register task definition
        id: task-definition
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-rendered.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
      
      # Listo, ya la revision creada de la definicion de tarea ahora tenemos que actualizar
      # el servicio de ECS para que use la nueva revision de la definicion de tarea.
      # Entonces ECS inicia nuevas tareas con la imagen nueva y retira gradualmente las anteriores
      # Aca es donde justamente se da el despliegue de la nueva version de la aplicacion en el cluster de ECS.
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-definition.outputs.arn }}" \
            --force-new-deployment
      
      # Por ultimo nos quedamos esperando hasta que ECS confirme que el servicio esta estable, osea
      # que las tareas nuevas esten en estado de 'Running', que la ALB este 'healthy', no haya tareas fallando y el servicio alcance la unidad deseada
      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # NOTA: El workflow de CI/CD actual lo que hace es subir una nueva imagen nueva al repositorio ECR, luego modifica la definicion de tarea de ECS para que use la nueva imagen, crea una nueva revision de definicion de tarea
      # y finalmente actualiza el servicio de ECS. Sin embargo no crea el repositorio ECR, ni subredes, ni la bdd RDS, ni el balanceador ALB, ni cluster, ni grupos de seguridad
      # Esto quiere decir que si por ejemplo en la nube de AWS eliminamos el recurso VPC o subredes o ALB, etc. entonces el workflow de CI/CD no va a poder desplegar la aplicacion porque no existen los recursos necesarios para que ECS funcione
      # Por eso es importante que antes de ejecutar el workflow de CI/CD, primero hayamos creado todos los recursos necesarios en AWS.